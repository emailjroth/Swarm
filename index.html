<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Swarm</title>
  
  <!-- PWA & iPad Standalone Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Swarm">
  <meta name="theme-color" content="#000000">
  
  <!-- Explicit Apple Touch Icon Links -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="swarmCanvas"></canvas>

  <!-- Subtle Auto-Hiding Settings Trigger -->
  <button id="gearBtn" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- Minimalist Glassmorphism Control Panel -->
  <div id="settingsPanel" class="hidden">
    <div class="panel-header">
      <span>SWARM CONTROLS</span>
      <button id="closeBtn">&times;</button>
    </div>

    <div class="control-group">
      <label for="behaviorSelect">Behavior Preset</label>
      <select id="behaviorSelect">
        <option value="flock" selected>Organic Flock</option>
        <option value="vortex">Tornado Vortex</option>
        <option value="drift">Lazy Drift</option>
        <option value="hive">Chaotic Hive</option>
      </select>
    </div>

    <div class="control-group">
      <label for="countSlider">Swarm Size <span id="countVal">400</span></label>
      <input type="range" id="countSlider" min="50" max="400" value="400">
    </div>

    <div class="control-group">
      <label for="speedSlider">Base Speed <span id="speedVal">5.0</span></label>
      <input type="range" id="speedSlider" min="1.0" max="8.0" step="0.5" value="5.0">
    </div>

    <div class="control-group">
      <label for="colorSelect">Color Palette</label>
      <select id="colorSelect">
        <option value="cyan">Bioluminescent Cyan</option>
        <option value="ember">Solar Ember</option>
        <option value="aurora" selected>Aurora Violet</option>
        <option value="mono">Pure Stardust</option>
        <option value="custom">Custom Colors...</option>
      </select>
    </div>

    <!-- Custom Color Pickers -->
    <div id="customColorGroup" class="control-group color-picker-row hidden">
      <input type="color" id="customColor1" value="#00f2fe" aria-label="Color 1">
      <input type="color" id="customColor2" value="#ff0844" aria-label="Color 2">
      <input type="color" id="customColor3" value="#ffffff" aria-label="Color 3">
    </div>

    <div class="control-group toggle-row">
      <label for="pulsateToggle">Pulsate (Drum Beat)</label>
      <input type="checkbox" id="pulsateToggle" checked>
    </div>

    <div class="control-group toggle-row">
      <label for="predatorToggle">Touch: <span id="touchModeLabel">Repel Scatter</span></label>
      <input type="checkbox" id="predatorToggle" checked>
    </div>

    <div class="status-footer">
      <span id="wakeStatus">Screen Wake Lock: Active</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
